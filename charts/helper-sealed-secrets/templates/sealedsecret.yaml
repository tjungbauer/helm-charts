{{- range $name, $secret := .Values.secrets }}
{{- if ne ($secret.enabled | toString) "false" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ required (printf "secrets.%s.namespace is required" $name) $secret.namespace | quote }}
  annotations:
    {{- include "tpl.argocdMetadata"
          (dict "syncWave" $secret.syncwave
                "extra" ($secret.additionalAnnotations | default dict)) | nindent 4 }}
  labels:
    {{- include "tpl.labels" $ | nindent 4 }}
    {{- include "tpl.additionalLabels" ($secret.additionalLabels | default dict) | indent 4 }}
spec:
  encryptedData:
    {{- required (printf "secrets.%s.encryptedData is required" $name) $secret.encryptedData | toYaml | nindent 4 }}
  template:
    metadata:
      name: {{ $name | quote }}
      namespace: {{ $secret.namespace | quote }}
    {{- with $secret.type }}
    type: {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
